<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محول مودات ماين كرافت إلى Rust</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2rem; border-radius: 16px; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    h1 { color: #38bdf8; font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
    select { width: 100%; padding: 12px; margin-bottom: 1rem; border-radius: 8px; background: #0f172a; color: #f8fafc; border: 1px solid #38bdf8; font-size: 1rem; cursor: pointer; }
    input[type="file"] { display: none; }
    .upload-btn { background: #0284c7; color: white; padding: 12px 24px; border-radius: 8px; cursor: pointer; display: inline-block; font-weight: bold; transition: 0.2s; width: 85%; }
    .upload-btn:hover { background: #0369a1; }
    #status { margin-top: 1.5rem; font-size: 0.95rem; line-height: 1.6; word-break: break-word; }
    .download-btn { color: #ffffff; font-weight: bold; text-decoration: none; display: inline-block; margin-top: 12px; padding: 12px 24px; background: #16a34a; border-radius: 8px; transition: 0.2s; }
    .download-btn:hover { background: #15803d; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚡ محول مودات Java إلى Rust</h1>
    <p>اختر جهازك ثم ارفع ملف المود (.jar) لتحويله لمحرك Horizon و Starling تلقائياً.</p>
    
    <select id="platform">
      <option value="android">📱 الأندرويد (ARM64 - aarch64)</option>
      <option value="pc">💻 الكمبيوتر (PC - x86_64 Windows/Linux)</option>
    </select>

    <label class="upload-btn">
      اختر ملف المود (.jar)
      <input type="file" id="modFile" accept=".jar">
    </label>
    <div id="status"></div>
  </div>

  <script>
    let checkInterval;

    function startChecking() {
      const status = document.getElementById('status');
      checkInterval = setInterval(async () => {
        try {
          const res = await fetch('/api/download');
          const data = await res.json();

          if (data.status === 'ready') {
            clearInterval(checkInterval);
            status.innerHTML = `🎉 اكتمل التحويل والتجميع بنجاح!<br><a class="download-btn" href="/api/download?download=true">تحميل المود الجاهز الآن (.zip) ⬇️</a>`;
          } else if (data.status === 'failed') {
            clearInterval(checkInterval);
            status.innerHTML = "❌ تعذر تجميع هذا المود، يرجى تجربة مود أبسط.";
          }
        } catch (e) {}
      }, 10000);
    }

    document.getElementById('modFile').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (checkInterval) clearInterval(checkInterval);

      const platform = document.getElementById('platform').value;
      const status = document.getElementById('status');
      status.innerHTML = "⏳ جاري رفع المود وإرساله لمحرك الذكاء الاصطناعي...";

      const reader = new FileReader();
      reader.onload = async () => {
        const base64 = reader.result.split(',')[1];
        try {
          const res = await fetch('/api/upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fileBase64: base64, platform: platform })
          });
          const data = await res.json();
          if (data.success) {
            status.innerHTML = "⚙️ تم استلام المود! يقوم الذكاء الاصطناعي الآن بالترجمة والتجميع...<br><small>(يستغرق الأمر حوالي دقيقتين، سيظهر زر التحميل هنا تلقائياً)</small>";
            setTimeout(startChecking, 15000);
          } else {
            status.innerHTML = "❌ خطأ: " + data.error;
          }
        } catch (err) {
          status.innerHTML = "❌ خطأ في الشبكة: " + err.message;
        }
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
